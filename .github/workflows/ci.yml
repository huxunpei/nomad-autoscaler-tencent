name: Source checks and candidate artifacts
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.26.6'
          cache: true
      - name: Prepare exact source
        shell: bash
        run: |
          python3 -B scripts/test_prepare_source.py
          python3 -B scripts/prepare_source.py --source . --output "$RUNNER_TEMP/tencent-source" --module github.com/huxunpei/nomad-autoscaler-tencent --gofmt "$(go env GOROOT)/bin/gofmt" --mode candidate --version 0.1.1
      - name: Check
        shell: bash
        run: python3 -B "$RUNNER_TEMP/tencent-source/scripts/check_review.py" --source "$RUNNER_TEMP/tencent-source" --output "$RUNNER_TEMP/tencent-checks" --go "$(command -v go)"
      - name: Build both architectures
        shell: bash
        run: python3 -B "$RUNNER_TEMP/tencent-source/scripts/build_review.py" --source "$RUNNER_TEMP/tencent-source" --output "$RUNNER_TEMP/tencent-artifacts" --go "$(command -v go)" --mode candidate --version 0.1.1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: candidate-evidence
          path: |
            ${{ runner.temp }}/tencent-checks
            ${{ runner.temp }}/tencent-artifacts
          retention-days: 7
